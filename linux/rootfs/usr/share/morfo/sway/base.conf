# Morfo Linux — sway em modo quiosque.
# Visual igual ao do cage (um app em tela cheia, sem barras nem bordas), mas
# com atalhos: Super+Espaço abre a Central do Morfo por cima de tudo.

# Sem barra, sem bordas, sem espaços.
default_border none
default_floating_border none
hide_edge_borders both
gaps inner 0
gaps outer 0
titlebar_border_thickness 0
titlebar_padding 1
focus_follows_mouse no
mouse_warping none
popup_during_fullscreen smart
seat * hide_cursor 8000

# Cada janela principal ocupa a tela inteira, empilhada sobre a anterior;
# fechar a de cima revela a de baixo. Diálogos (já flutuantes) ficam do
# tamanho que o app pedir.
for_window [tiling] floating enable, border none, resize set width 100 ppt height 100 ppt, move position 0 0

# Atalhos (só estes: nada de atalhos padrão do sway).
bindsym --no-repeat Mod4+space exec /usr/local/bin/morfo-central
bindsym --no-repeat Mod4+Escape exec /usr/local/bin/morfo-central
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle

# Toque no touchpad e rolagem natural desligada (o comportamento esperado).
input type:touchpad {
    tap enabled
    natural_scroll disabled
}
