#### Morfo Linux — respostas automáticas do instalador Debian.
#### O instalador ainda PERGUNTA: teclado, rede (se precisar), fuso horário,
#### seu nome/usuário/senha e QUAL DISCO APAGAR (com confirmação).

# Idioma e região
d-i debian-installer/language string pt_BR
d-i debian-installer/country string BR
d-i debian-installer/locale string pt_BR.UTF-8
d-i localechooser/supported-locales multiselect pt_BR.UTF-8, en_US.UTF-8

# Rede
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string morfo
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

# Espelho do Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Contas: sem senha de root; o usuário criado ganha sudo.
d-i passwd/root-login boolean false

# Relógio
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Disco: tudo numa partição. O disco e a confirmação continuam sendo perguntados.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-efi/non_efi_system boolean true

# Repositórios: contrib e non-free para firmwares e o Wi-Fi dos Macs.
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false

# Sem ambiente de desktop: o Morfo traz a própria interface.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string curl gnupg ca-certificates pciutils
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB também no caminho removível do EFI: é o que o firmware dos Macs procura.
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true

# No fim, instala o Morfo Linux (e o Claude, do repositório oficial).
d-i preseed/late_command string sh /cdrom/morfo/late.sh

d-i finish-install/reboot_in_progress note
