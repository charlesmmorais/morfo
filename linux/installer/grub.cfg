# Morfo Linux — menu de boot da ISO (UEFI).
set default=0
set timeout=30

insmod all_video
insmod gfxterm
insmod png
insmod jpeg
set gfxmode=auto
loadfont $prefix/themes/morfo/morfo-14.pf2
loadfont $prefix/themes/morfo/morfo-18.pf2
terminal_output gfxterm
set theme=$prefix/themes/morfo/theme.txt

menuentry "Instalar  ·  tema Grafite" {
    set background_color=black
    linux  /install.amd/vmlinuz vga=788 morfo_tema=grafite --- quiet
    initrd /install.amd/gtk/initrd.gz
}

menuentry "Instalar  ·  tema Areia" {
    set background_color=black
    linux  /install.amd/vmlinuz vga=788 morfo_tema=areia --- quiet
    initrd /install.amd/gtk/initrd.gz
}

menuentry "Instalar em modo texto" {
    linux  /install.amd/vmlinuz morfo_tema=grafite --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Configurações do firmware" {
    fwsetup
}
