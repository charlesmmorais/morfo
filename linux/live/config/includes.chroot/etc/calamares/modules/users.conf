---
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - render
  - kvm
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
  minLength: 4
user:
  shell: /bin/bash
  forbidden_names: [ root, morfo ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "morfo"
