# Morfo Linux — instalador (Calamares)
---
modules-search: [ local ]

instances:
- id: morfohost
  module: shellprocess
  config: shellprocess-morfohost.conf
- id: morfo
  module: shellprocess
  config: shellprocess-morfo.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@morfohost
  - shellprocess@morfo
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: morfo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
