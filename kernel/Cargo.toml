[package]
name = "morfo-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
limine = "0.6"
spin = "0.10"
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
pc-keyboard = "0.8"
linked_list_allocator = "0.10"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
pic8259 = "0.11"
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
uart_16550 = "0.3"

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = 2
